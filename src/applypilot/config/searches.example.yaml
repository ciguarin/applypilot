# ApplyPilot search configuration: Canadian internship defaults
# Generated by applypilot init. Edit directly or run: applypilot config searches

sites:
  - indeed
  - linkedin

defaults:
  location: "Canada"
  distance: 50
  hours_old: 168
  results_per_site: 50
  country_indeed: canada

locations:
  - location: "Canada"
    remote: true

# Search queries: intern/co-op focused
queries:
  - query: "Software Intern"
    tier: 1
  - query: "Software Developer Intern"
    tier: 2
  - query: "Backend Engineer Intern"
    tier: 2
  - query: "Full Stack Developer Intern"
    tier: 2
  - query: "Developer Intern"
    tier: 2
  - query: "DevOps Intern"
    tier: 2
